# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: On Pull Request To Main
run-name: "Pull Request To Main by ${{ github.actor }}"
on: 
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        build_type: [Release, Debug]
        c_compiler: [clang]
        include:
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Install Requirements
      run: |
        sudo bash requirements.sh

    - name: Set Up VCPkg
      id: vcpkg-setup
      run: |
        cd ${{ github.workspace }}/..
        git clone https://github.com/microsoft/vcpkg.git
        cd ./vcpkg
        ./bootstrap-vcpkg.sh
        ./vcpkg integrate install
        ./vcpkg integrate bash
        ./vcpkg install gtest
        echo "VCPKG_ROOT=${{ github.workspace }}/../vcpkg/" >> "$GITHUB_OUTPUT"

    - name: Build Project
      env:
        VCPKG_ROOT: ${{ steps.vcpkg-setup.outputs.VCPKG_ROOT }}
      run: |
        cd ${{ github.workspace }}
        mkdir build
        cd build
        mkdir ${{ matrix.build_type }}
        cd ${{ matrix.build_type }}
        echo "$PWD"
        echo "$VCPKG_ROOT"
        ninja --version
        cmake ../.. -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -D CMAKE_C_COMPILER=clang -D CMAKE_CXX_COMPILER=clang++
        ninja
    
    - name: Run Hello World tests
      run: |
        ./build/${{ matrix.build_type}}/test/hello_world_test